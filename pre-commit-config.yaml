# ============================================================================
# .pre-commit-config.yaml   ->   SAVE AS ".pre-commit-config.yaml"
# (leading dot!) at the ROOT of the devsecopsNIDS repo, next to Jenkinsfile
#
# Covers Lab 1 (Pre-Commit Security Hooks) + NEXT STEP 1 (gitleaks):
#   Layer 1 - gitleaks   : blocks hardcoded secrets in STAGED content
#   Layer 2 - HMRC hooks : the course-lab hooks (sensitive file TYPES +
#                          sensitive file CONTENT patterns)
#
# SETUP FOR WINDOWS PC (your current path):
#   - requires: pre-commit via pip (installed) + gitleaks.exe on PATH
#     (gitleaks_8.30.1_windows_x64.zip from the gitleaks releases page)
#   - the active hook id below is gitleaks-system -> uses gitleaks.exe
#
# IF YOU EVER COMMIT FROM THE VAGRANT VM INSTEAD:
#   Docker is already on the VM, so swap the active id to gitleaks-docker
#   (one line change, marked below) and delete gitleaks-system.
#
# INSTALL & USE:
#   pre-commit install            (wires .git/hooks/pre-commit - run once)
#   pre-commit autoupdate         (optional: bump hook revs to latest)
#   git commit ...                hooks run automatically on staged files
#   pre-commit run --all-files    use the hooks as a whole-repo scanner
#   git commit --no-verify        BYPASSES the hooks (why Jenkins stage 1b
#                                 exists - do the red-demo to prove it)
# ============================================================================

repos:
  # ------------------------------------------------------------------
  # 1) gitleaks v8.30.1 - secret detection on staged changes.
  #    ACTIVE: gitleaks-system -> calls the gitleaks.exe on your PATH.
  #    Alternatives (swap the id if needed):
  #      gitleaks-docker -> zero install, needs Docker on the commit machine
  #                         (the right choice on the Vagrant VM)
  #      gitleaks        -> pre-commit compiles it from source (needs Go)
  # ------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
      # - id: gitleaks-docker    <- use this one on the VM instead

  # ------------------------------------------------------------------
  # 2) Course Lab 1 hooks - HMRC security-git-hooks (rev from the lab PDF).
  #    exclude = binary/archive types the content scanner cannot usefully
  #    read (regex cleaned of the PDF line-wrap artifacts: ".de$" removed,
  #    doubled "|" collapsed).
  # ------------------------------------------------------------------
  - repo: https://github.com/hmrc/security-git-hooks
    rev: v1.0.0-beta9
    hooks:
      - id: secrets_filecontent
        name: Checking staged files for sensitive content
        exclude: ".tar$|.gz$|.jar$|.7z$|.rar$|.bz2$|.zip$|.gzip$|.war$|.ear$|.xlsx$|.xls$|.docx$|.doc$|.pptx$|.pdf$|.jpg$|.png$|.jpeg$|.tif$|.tiff$|.gif$|.bmp$|.webp$|.svg$|.ico$|.psd$|.exe$|.dll$|.dmg$|.rpm$"
      - id: secrets_filename
        name: Checking staged files for sensitive file types
        exclude: ".tar$|.gz$|.jar$|.7z$|.rar$|.bz2$|.zip$|.gzip$|.war$|.ear$|.xlsx$|.xls$|.docx$|.doc$|.pptx$|.pdf$|.jpg$|.png$|.jpeg$|.tif$|.tiff$|.gif$|.bmp$|.webp$|.svg$|.ico$|.psd$|.exe$|.dll$|.dmg$|.rpm$"
      - id: hooks_version_check
        name: Checking local hooks against latest release
        verbose: true
